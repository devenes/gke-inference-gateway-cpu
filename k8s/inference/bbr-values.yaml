bbr:
  name: body-based-router
  replicas: 1
  image:
    registry: registry.k8s.io
    repository: gateway-api-inference-extension/bbr
    tag: v1.5.0
    pullPolicy: IfNotPresent
  port: 9004
  healthCheckPort: 9005
  multiNamespace: false
  flags:
    v: 3
  plugins:
    - type: body-field-to-header
      name: model-extractor
      json:
        fieldName: model
        headerName: X-Gateway-Model-Name
    - type: body-field-to-header
      name: objective-extractor
      json:
        fieldName: model
        headerName: x-gateway-inference-objective
    - type: base-model-to-header
      name: base-model-mapper
  tracing:
    enabled: false

provider:
  name: gke

inferenceGateway:
  name: inference-gateway
